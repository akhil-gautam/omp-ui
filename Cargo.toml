[workspace]
# Resolver 3 enables cargo's MSRV-aware version selection, so the dependency
# tree stays inside the toolchain this project declares (rustc 1.87) instead
# of pulling in crates that demand a newer compiler.
resolver = "3"
members = ["src-tauri", "vendor/omp-rpc"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
