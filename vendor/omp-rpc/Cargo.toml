[package]
name = "omp-rpc"
version = "0.1.0"
edition = "2024"
description = "Rust client for the omp RPC protocol (`omp --mode rpc`)"
license = "MIT"
publish = false
# Vendored from github.com/can1357/oh-my-pi @ sdk/rust/omp-rpc (see vendor/README.md).
# The upstream `[workspace]` table is removed so this crate joins omp-ui's workspace.


[lib]
name = "omp_rpc"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
